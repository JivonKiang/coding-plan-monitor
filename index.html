<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coding Plan 额度总览</title>
<style>
:root{
  --bg:#0d0e12; --card:#16181d; --line:#262a33; --txt:#e7e9ee; --mut:#8a90a0;
  --blue:#3b82f6; --orange:#f97316; --green:#22c55e; --amber:#f59e0b; --red:#ef4444; --purple:#a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;padding:14px 12px 40px;max-width:780px;margin:0 auto}
h1{font-size:19px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
h1 small{font-size:12px;color:var(--mut);font-weight:400}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.badge.blue{color:#93c5fd;border-color:#1e3a8a}
.badge.orange{color:#fdba74;border-color:#7c2d12}
.row{margin:10px 0}
.row .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.row .top b{font-weight:600}
.pct{font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:7px;border-radius:99px;background:#22252d;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.meta{font-size:11px;color:var(--mut);margin-top:4px}
.cd{color:#c7cbf5}
.big{font-size:26px;font-weight:800;letter-spacing:-.5px}
.sub{font-size:11.5px;color:var(--mut);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
th,td{text-align:right;padding:5px 4px;border-bottom:1px solid #1e2129;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500;font-size:11.5px}
tr:last-child td{border-bottom:none}
svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:11px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
footer{margin-top:16px;font-size:11.5px;color:var(--mut);line-height:1.7;border-top:1px solid var(--line);padding-top:10px}
.err{color:var(--red);font-size:13px}
section.t{margin-top:12px}
</style>
</head>
<body>
<h1>Coding Plan 额度总览 <small id="upd">加载中…</small></h1>

<div class="grid">
  <div class="card" id="zcard"><h2>智谱 GLM <span class="badge blue" id="zlevel">—</span></h2><div id="zbody" class="mut">加载中…</div></div>
  <div class="card" id="vcard"><h2>火山方舟 <span class="badge orange" id="vedition">—</span></h2><div id="vbody">加载中…</div></div>
</div>

<section class="t card">
  <h2>今日消耗 <span class="badge" id="tdate">—</span></h2>
  <div id="tbody">加载中…</div>
</section>

<section class="t card">
  <h2>近 7 天 tokens（智谱）</h2>
  <div id="chart7">加载中…</div>
</section>

<section class="t card">
  <h2>历史占用趋势</h2>
  <div id="trend">暂无足够快照</div>
</section>

<footer>
  数据来源：智谱开放平台 API + 火山方舟 arkcli，由本机 <code>update.mjs</code> 采集并推送快照。<br>
  更新方式：电脑上运行 <code>node update.mjs</code>（自动采集并推送），手机刷新本页即见最新。
</footer>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>n==null?'—':Number(n).toLocaleString('zh-CN');
const pctColor=p=>p>=80?'var(--red)':p>=50?'var(--amber)':'var(--green)';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ago(ms){const d=Date.now()-ms;if(d<60e3)return'刚刚';if(d<3600e3)return Math.round(d/60e3)+' 分钟前';if(d<86400e3)return Math.round(d/3600e3)+' 小时前';return new Date(ms).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function countdown(ms){if(!ms)return'';let s=Math.max(0,Math.round((ms-Date.now())/1000));const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);return h>0?`${h}小时${m}分后`:`${m}分钟后`}

function winRow(w){
  return `<div class="row"><div class="top"><b>${esc(w.label)}</b><span class="pct" style="color:${pctColor(w.pct)}">${w.pct.toFixed(1)}%</span></div>
  <div class="bar"><i style="width:${Math.min(100,w.pct)}%;background:${pctColor(w.pct)}"></i></div>
  <div class="meta">${fmt(w.used)} / ${fmt(w.cap)} · <span class="cd" data-reset="${w.reset||''}">${w.reset?countdown(w.reset)+'重置':'—'}</span></div></div>`;
}

function render(d){
  const z=d.zhipu,v=d.volc;
  $('upd').textContent='更新于 '+ago(d.ts);
  // 智谱
  if(z&&z.limits){
    $('zlevel').textContent='Lite';
    $('zbody').innerHTML=z.limits.map(winRow).join('')+
      `<div class="meta">近7天 ${fmt(z.totalTokens7d)} tokens / ${fmt(z.totalCalls)} 次调用</div>`;
  } else $('zbody').innerHTML='<span class="err">智谱数据缺失</span>';
  // 火山
  if(v&&v.periods){
    $('vedition').textContent=v.edition;
    $('vbody').innerHTML=v.periods.map(winRow).join('');
  } else $('vbody').innerHTML='<span class="err">火山数据缺失</span>';
  // 今日
  const t=d.today;
  if(t){
    $('tdate').textContent=t.date;
    $('tbody').innerHTML=`<div class="big">${fmt(t.totalTokens)}</div><div class="sub">tokens · ${fmt(t.totalCalls)} 次调用</div>`+
      (t.byModel&&t.byModel.length?`<table><tr><th>模型</th><th>今日 tokens</th><th>占 7 天总量</th></tr>`+
        t.byModel.map(m=>`<tr><td>${esc(m.model)}</td><td>${fmt(m.tokens)}</td><td>${(m.share*100).toFixed(1)}%</td></tr>`).join('')+'</table>':'');
  }
  // 7 天堆叠柱状图
  if(d.days&&d.byModelDaily) $('chart7').innerHTML=stackedChart(d.days,d.byModelDaily);
  // 趋势
  if(d.history&&d.history.length>=2) $('trend').innerHTML=trendChart(d.history);
  else $('trend').textContent='快照积累中（'+((d.history||[]).length)+' 个点，≥2 个后绘制）';
}

const MC={'GLM-5.3-Flash':'var(--purple)','GLM-5.3':'var(--blue)','GLM-4.7':'var(--green)'};
const mc=n=>MC[n]||'var(--orange)';

function stackedChart(days,byModel){
  const W=720,H=170,P={l:8,r:8,t:14,b:20},iw=W-P.l-P.r,ih=H-P.t-P.b;
  const models=Object.keys(byModel).sort((a,b)=>byModel[b].total-byModel[a].total);
  const totals=days.map((_,i)=>models.reduce((s,m)=>s+(byModel[m].daily[i]||0),0));
  const max=Math.max(1,...totals),bw=iw/days.length;
  let bars='';
  days.forEach((day,i)=>{
    let y=ih+P.t;
    models.forEach(m=>{
      const v=byModel[m].daily[i]||0;if(!v)return;
      const h=v/max*ih;y-=h;
      bars+=`<rect x="${(P.l+i*bw+bw*.15).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${mc(m)}" opacity=".85"/>`;
    });
    bars+=`<text x="${P.l+i*bw+bw/2}" y="${H-5}" font-size="9.5" fill="var(--mut)" text-anchor="middle">${day.slice(5)}</text>`;
    if(totals[i])bars+=`<text x="${P.l+i*bw+bw/2}" y="${(y-4).toFixed(1)}" font-size="9" fill="var(--mut)" text-anchor="middle">${(totals[i]/1e6).toFixed(1)}M</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}">${bars}</svg><div class="legend">${models.map(m=>`<span><i style="background:${mc(m)}"></i>${esc(m)}</span>`).join('')}</div>`;
}

function trendChart(h){
  const W=720,H=160,P={l:34,r:10,t:12,b:18},iw=W-P.l-P.r,ih=H-P.t-P.b;
  const X=i=>P.l+i/(h.length-1)*iw, Y=p=>P.t+(1-p/100)*ih;
  const path=k=>h.map((pt,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(pt[k]).toFixed(1)).join('');
  let g='';
  [0,50,100].forEach(p=>{g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(p)}" y2="${Y(p)}" stroke="#22252d" stroke-width="1"/><text x="${P.l-5}" y="${Y(p)+3}" font-size="9" fill="var(--mut)" text-anchor="end">${p}%</text>`});
  g+=`<path d="${path('zWorstPct')}" fill="none" stroke="var(--blue)" stroke-width="2"/>`;
  g+=`<path d="${path('vSessionPct')}" fill="none" stroke="var(--orange)" stroke-width="2"/>`;
  h.forEach((pt,i)=>{g+=`<circle cx="${X(i)}" cy="${Y(pt.zWorstPct)}" r="2.5" fill="var(--blue)"/><circle cx="${X(i)}" cy="${Y(pt.vSessionPct)}" r="2.5" fill="var(--orange)"/>`});
  const step=Math.ceil(h.length/6);
  h.forEach((pt,i)=>{if(i%step===0||i===h.length-1)g+=`<text x="${X(i)}" y="${H-4}" font-size="9" fill="var(--mut)" text-anchor="middle">${new Date(pt.ts).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="legend"><span><i style="background:var(--blue)"></i>智谱最紧窗口</span><span><i style="background:var(--orange)"></i>火山 5h 窗口</span></div>`;
}

setInterval(()=>{document.querySelectorAll('.cd').forEach(el=>{const r=+el.dataset.reset;if(r)el.textContent=countdown(r)+'重置'})},30000);

fetch('data.json?t='+Date.now()).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(render).catch(e=>{$('upd').textContent='加载失败';$('zbody').innerHTML=`<span class="err">无法加载 data.json：${esc(e.message)}</span>`});
</script>
</body>
</html>
